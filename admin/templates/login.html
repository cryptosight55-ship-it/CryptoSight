<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in - CryptoSight Admin</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
               background: #0f1115; color: #e5e7eb; display: flex; align-items: center;
               justify-content: center; height: 100vh; margin: 0; }
        form { background: #171a21; border: 1px solid #2a2e37; border-radius: 10px;
               padding: 2rem; width: 280px; }
        h1 { font-size: 1.1rem; margin: 0 0 1.25rem; }
        input { width: 100%; box-sizing: border-box; background: #1f232c; border: 1px solid #2a2e37;
                color: #e5e7eb; padding: 0.6rem; border-radius: 6px; margin-bottom: 1rem; }
        button { width: 100%; background: #2563eb; color: white; border: none;
                 padding: 0.6rem; border-radius: 6px; cursor: pointer; }
        .error { color: #f87171; font-size: 0.85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <form method="post" action="/admin/login">
        <h1>CryptoSight Admin</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <input type="password" name="password" placeholder="Password" autofocus required>
        <button type="submit">Log in</button>
    </form>
</body>
</html>
