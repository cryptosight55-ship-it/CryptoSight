services:
  - type: web
    name: cryptosight
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # paste your Neon connection string in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DISCORD_WEBHOOK
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "meta-llama/llama-3.3-70b-instruct:free"
      - key: TRADING_BOT_MODE
        value: "prod"
      - key: LOG_LEVEL
        value: "INFO"
