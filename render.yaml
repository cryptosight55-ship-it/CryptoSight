services:
  - type: web
    name: cryptosight
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt  # Originally set because Binance.com blocks US-based
                        # IPs (the Render default, oregon, is US) -- caused
                        # a 451 error before this was set. Kept as-is after
                        # the Sept 2026 migration to Bybit (config/settings.py);
                        # no reason to move back to a US region.
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # paste your Neon connection string in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DISCORD_WEBHOOK
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "meta-llama/llama-3.3-70b-instruct:free"
      - key: TRADING_BOT_MODE
        value: "prod"
      - key: LOG_LEVEL
        value: "INFO"
